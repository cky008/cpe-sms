services:
  cpe-sms:
    build: .
    container_name: cpe-sms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - STATE_FILE=/app/data/state.json
      - HTTP_PORT=${HTTP_PORT:-8080}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
