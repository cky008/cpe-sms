services:
  # 主服务：CPE 短信轮询 + Telegram 机器人 + 实时网页与 REST API（默认监听高位端口 18383）
  cpe-sms:
    image: ghcr.io/cky008/cpe-sms:latest
    build: .
    container_name: cpe-sms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - STATE_FILE=/app/data/state.json
      - ARCHIVE_FILE=/app/data/sms-archive.json
      - CONTACTS_FILE=/app/data/contacts.json
      - WEB_ENABLED=${WEB_ENABLED:-true}
      - WEB_PORT=${WEB_PORT:-18383}
      - HTTP_PORT=${HTTP_PORT:-0}
    ports:
      - "${WEB_PORT:-18383}:18383"
    volumes:
      - ./data:/app/data

  # 可选前端独立代理容器：通过 `docker compose --profile web up -d` 开启
  cpe-sms-web:
    image: ghcr.io/cky008/cpe-sms:latest
    build: .
    container_name: cpe-sms-web
    profiles: ["web"]
    restart: unless-stopped
    command: ["node", "dist/cli.js", "web"]
    depends_on:
      - cpe-sms
    environment:
      - TZ=${TZ:-UTC}
      - WEB_PORT=18383
      - WEB_UPSTREAM_URL=http://cpe-sms:18383
    ports:
      - "${WEB_STANDALONE_PORT:-18384}:18383"
